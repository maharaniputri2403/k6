<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Smart Agriculture IoT Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="header">
    <h1>🌱 SMART AGRICULTURE IoT DASHBOARD</h1>
    <p>Monitoring & Kontrol Tanaman Berbasis ESP32 dan ThingSpeak</p>
</div>

<div class="summary">

<div class="summary-card">
    <h3>🌡️ Suhu</h3>
    <span id="tempValue">0°C</span>
</div>

<div class="summary-card">
    <h3>💨 Humidity</h3>
    <span id="humValue">0%</span>
</div>

<div class="summary-card">
    <h3>🌱 Soil Moisture</h3>
    <span id="soilValue">0%</span>
</div>

</div>

<div class="container">

<div class="card">
    <h2>📈 Monitoring Sensor</h2>

    <div class="canvas-container">
        <canvas id="lineDHT"></canvas>
    </div>
</div>

<div class="card">

    <h2>🌱 Soil Moisture</h2>

    <div class="canvas-container">
        <canvas id="gaugeSoil"></canvas>
    </div>

    <div class="status-text">
        Kondisi Tanah :
        <span id="soilTxt">0</span>%
    </div>

</div>

<div class="card">

    <h2>⚙️ Kontrol Aktuator</h2>

    <div class="control-group">

        <h3>🌀 Kipas</h3>

        <div class="btn-container">

            <button class="btn-on"
                    onclick="controlDevice('kipas','on')">
                ON
            </button>

            <button class="btn-off"
                    onclick="controlDevice('kipas','off')">
                OFF
            </button>

        </div>

        <div class="status-text">
            Status :
            <span id="kipasStatus">OFFLINE</span>
        </div>

    </div>

    <div class="control-group">

        <h3>💧 Pompa</h3>

        <div class="btn-container">

            <button class="btn-on"
                    onclick="controlDevice('pompa','on')">
                ON
            </button>

            <button class="btn-off"
                    onclick="controlDevice('pompa','off')">
                OFF
            </button>

        </div>

        <div class="status-text">
            Status :
            <span id="pompaStatus">OFFLINE</span>
        </div>

    </div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
